name: Scrape Google Trends

on:
  schedule:
    # Runs every 20 minutes. GitHub Actions cron is UTC-only and best-effort
    # (expect occasional 5-30 min delays at peak times) — fine for this use case.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write # required so the workflow can commit the updated JSON back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create output directory
        run: mkdir -p output

      - name: Scrape Kenya
        run: python3 scrape_trends.py --geo KE --category 17 --out output/trending-ke.json

      - name: Scrape Nigeria
        run: python3 scrape_trends.py --geo NG --category 17 --out output/trending-ng.json

      - name: Scrape Tanzania
        run: python3 scrape_trends.py --geo TZ --category 17 --out output/trending-tz.json

      - name: Scrape Uganda
        run: python3 scrape_trends.py --geo UG --category 17 --out output/trending-ug.json

      - name: Scrape South Africa
        run: python3 scrape_trends.py --geo ZA --category 17 --out output/trending-za.json

      - name: Scrape Denmark
        run: python3 scrape_trends.py --geo DK --category 17 --out output/trending-dk.json

      - name: Scrape Ghana
        run: python3 scrape_trends.py --geo GH --category 17 --out output/trending-gh.json

      - name: Scrape Egypt
        run: python3 scrape_trends.py --geo EG --category 17 --out output/trending-eg.json

      - name: Scrape Argentina
        run: python3 scrape_trends.py --geo AR --category 17 --out output/trending-ar.json

      - name: Commit and push updated JSON
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add output/*.json
          git diff --quiet --cached || git commit -m "Update trending data [skip ci]"
          git push
