name: Scrape Google Trends

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create output directory
        run: mkdir -p output

      - name: Scrape Uganda trends
        run: python3 scrape_trends.py --geo UG --category 17 --out output/trending-ug.json

      - name: Scrape Kenya trends
        run: python3 scrape_trends.py --geo KE --category 17 --out output/trending-ke.json

      - name: Commit and push updated JSON
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add output/*.json
          git diff --quiet --cached || git commit -m "Update trending data [skip ci]"
          git push
